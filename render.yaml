    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URI
        value: mongodb+srv://vikashkumawat1007_db_user:uFNj1xDgFM9ONAtp@cluster0.e0tcnaf.mongodb.net/
      - key: DATABASE_NAME
        value: customer_portal_db
